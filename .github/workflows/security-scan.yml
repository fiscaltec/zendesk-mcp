name: Security scan

# Gates merges on known-vulnerable NuGet packages and container-image CVEs (High/Critical).
# The weekly schedule re-scans unchanged main, so a CVE disclosed against existing dependencies is
# still caught. Waivers: security/nuget-vuln-allowlist.json (NuGet) and .trivyignore.yaml (image).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC, alongside the CodeQL sweep
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # SARIF upload to the Security tab

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuget-vuln:
    name: nuget-vuln
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Self-test the gate script (fixtures)
        shell: pwsh
        run: pwsh -NoProfile -File tests/Run-SecurityGateFixtures.ps1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ZendeskMcp.sln

      - name: List vulnerable packages
        run: >
          dotnet list ZendeskMcp.sln package --vulnerable --include-transitive --format json
          > nuget-vuln.json

      - name: Evaluate vulnerability gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Test-NuGetVulnerabilities.ps1 -JsonPath nuget-vuln.json

  image-cve:
    name: image-cve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t zendesk-mcp:scan -f Dockerfile .

      # Plain chiseled images carry no tzdata, and the reporting tools then fall back to UTC without
      # an error (#13), so check the zone data and the globalisation switch in the built image.
      - name: Image carries time-zone data
        run: |
          set -euo pipefail
          c=$(docker create zendesk-mcp:scan)
          trap 'docker rm -f "$c" >/dev/null' EXIT
          # Listed in full before matching: `grep -q` stops reading early, and under pipefail the
          # writer's SIGPIPE would then fail the step even when the file is there.
          files=$(docker export "$c" | tar -t)
          env=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$c")
          grep -qx 'usr/share/zoneinfo/Europe/London' <<<"$files" \
            || { echo '::error::the runtime image has no /usr/share/zoneinfo/Europe/London'; exit 1; }
          grep -qx 'DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=true' <<<"$env" \
            || { echo '::error::DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=true is not set in the runtime image'; exit 1; }
          echo 'time-zone data present; invariant globalisation on'

      - name: Trivy scan (gate on High/Critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zendesk-mcp:scan
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Trivy scan (SARIF, all severities, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zendesk-mcp:scan
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
